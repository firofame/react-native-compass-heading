name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org/

      - name: Validate release version
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} must match package version v${version}`);
          }

          const npmTag = version.split('+')[0].includes('-') ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `npm-tag=${npmTag}\n`);
          NODE

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

      - name: Build package
        run: yarn prepare

      - name: Publish package to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NPM_DIST_TAG: ${{ steps.release.outputs.npm-tag }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::Repository secret NODE_AUTH_TOKEN is required to publish to npmjs."
            exit 1
          fi

          npm publish --access public --provenance --tag "$NPM_DIST_TAG"
